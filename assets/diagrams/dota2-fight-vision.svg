<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Схема: бій без огляду у Dota 2">
  <title>Dota 2: бій без огляду</title>
  <!-- Фон -->
  <rect width="1600" height="900" fill="#10151d"/>
  <text x="48" y="72" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#f1f4f7">Бій без огляду</text>
  <text x="48" y="116" font-family="Arial, sans-serif" font-size="26" fill="#929ba8">Навчальна схема, а не запис реального матчу</text>

  <!-- Річка -->
  <path d="M 0 560 Q 400 520 800 560 T 1600 560 L 1600 660 Q 1200 700 800 660 T 0 660 Z" fill="rgba(57,67,81,0.4)"/>
  <text x="140" y="628" font-family="Arial, sans-serif" font-size="24" fill="#929ba8">річка</text>

  <!-- Загони туману війни -->
  <g>
    <ellipse cx="560" cy="300" rx="230" ry="130" fill="rgba(255,65,98,0.14)" stroke="#ff4162" stroke-width="3" stroke-dasharray="14 10"/>
    <text x="560" y="292" font-family="Arial, sans-serif" font-size="44" fill="#ff4162" text-anchor="middle">?</text>
    <text x="560" y="340" font-family="Arial, sans-serif" font-size="24" fill="#ff4162" text-anchor="middle">вороги у тумані війни</text>

    <ellipse cx="1020" cy="240" rx="200" ry="115" fill="rgba(255,65,98,0.14)" stroke="#ff4162" stroke-width="3" stroke-dasharray="14 10"/>
    <text x="1020" y="252" font-family="Arial, sans-serif" font-size="44" fill="#ff4162" text-anchor="middle">?</text>

    <ellipse cx="1330" cy="420" rx="170" ry="105" fill="rgba(255,65,98,0.14)" stroke="#ff4162" stroke-width="3" stroke-dasharray="14 10"/>
    <text x="1330" y="432" font-family="Arial, sans-serif" font-size="44" fill="#ff4162" text-anchor="middle">?</text>
  </g>

  <!-- Герої команди без вардів -->
  <circle cx="760" cy="740" r="24" fill="#00e3ad"/>
  <circle cx="900" cy="770" r="24" fill="#00e3ad"/>
  <circle cx="640" cy="780" r="24" fill="#00e3ad"/>
  <text x="760" y="840" font-family="Arial, sans-serif" font-size="26" fill="#f1f4f7" text-anchor="middle">ваша команда приймає бій «наосліп»</text>

  <!-- Засідка з туману -->
  <path d="M 640 400 Q 700 560 760 706" fill="none" stroke="#ff4162" stroke-width="6" stroke-dasharray="18 14" marker-end="url(#arrowRed)"/>
  <path d="M 1060 340 Q 980 540 906 736" fill="none" stroke="#ff4162" stroke-width="6" stroke-dasharray="18 14" marker-end="url(#arrowRed)"/>
  <text x="130" y="420" font-family="Arial, sans-serif" font-size="28" fill="#ff4162">вас атакують звідти,</text>
  <text x="130" y="458" font-family="Arial, sans-serif" font-size="28" fill="#ff4162">звідки не чекали</text>

  <!-- Рекомендація: вард -->
  <g transform="translate(1180,650)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" transform="rotate(45)" fill="#00e3ad"/>
  </g>
  <circle cx="1180" cy="650" r="180" fill="none" stroke="#00e3ad" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="1180" y="530" font-family="Arial, sans-serif" font-size="24" fill="#00e3ad" text-anchor="middle">обсервер-вард: зона огляду</text>
  <text x="1180" y="726" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad" text-anchor="middle">Рішення: ставте вард перед беєм</text>
  <path d="M 1240 480 Q 1300 330 1360 300" fill="none" stroke="#00e3ad" stroke-width="6" stroke-dasharray="18 14" marker-end="url(#arrowGreen)"/>

  <!-- Легенда -->
  <g font-family="Arial, sans-serif" font-size="24">
    <circle cx="1330" cy="120" r="12" fill="#ff4162"/>
    <text x="1352" y="128" fill="#ff4162">загроза</text>
    <circle cx="1330" cy="164" r="12" fill="#00e3ad"/>
    <text x="1352" y="172" fill="#00e3ad">рекомендація</text>
  </g>

  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#ff4162" stroke-width="2.5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#00e3ad" stroke-width="2.5"/>
    </marker>
  </defs>
</svg>
