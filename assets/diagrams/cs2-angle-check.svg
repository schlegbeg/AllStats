<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Схема: вилаз без перевірки кута у CS2">
  <title>CS2: вилаз без перевірки кута</title>
  <!-- Фон -->
  <rect width="1600" height="900" fill="#10151d"/>
  <text x="48" y="72" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#f1f4f7">Вихід без перевірки кута</text>
  <text x="48" y="116" font-family="Arial, sans-serif" font-size="26" fill="#929ba8">Навчальна схема, а не запис реального матчу</text>

  <!-- Стіна з кутом -->
  <rect x="180" y="60" width="70" height="840" fill="#394351"/>
  <text x="215" y="90" font-family="Arial, sans-serif" font-size="24" fill="#080b10" text-anchor="middle" transform="rotate(90 215 90)">стіна</text>

  <!-- Гравець за стіною -->
  <circle cx="120" cy="330" r="26" fill="#00e3ad"/>
  <text x="120" y="340" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#080b10" text-anchor="middle">В</text>
  <text x="120" y="390" font-family="Arial, sans-serif" font-size="24" fill="#f1f4f7" text-anchor="middle">Ви</text>

  <!-- Небезпечна зона: прихований кут справа -->
  <path d="M 250 840 L 1450 430 L 1450 880 Z" fill="rgba(255,65,98,0.16)" stroke="#ff4162" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1000" y="560" font-family="Arial, sans-serif" font-size="28" fill="#ff4162">неконтрольований кут</text>

  <!-- Ворог у прихованому куті -->
  <circle cx="1120" cy="750" r="28" fill="#ff4162"/>
  <text x="1120" y="760" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#080b10" text-anchor="middle">X</text>
  <text x="1120" y="820" font-family="Arial, sans-serif" font-size="26" fill="#ff4162" text-anchor="middle">ворог за кутом</text>

  <!-- Широкий вилаз у відкриту (стрілка загрози) -->
  <path d="M 160 350 Q 620 700 1050 745" fill="none" stroke="#ff4162" stroke-width="6" stroke-dasharray="18 14" marker-end="url(#arrowRed)"/>
  <text x="430" y="640" font-family="Arial, sans-serif" font-size="26" fill="#ff4162">широкий вихід у відкриту</text>

  <!-- Рекомендація: вузький вилаз по стіні -->
  <path d="M 250 700 L 250 560 L 640 780 Z" fill="rgba(0,227,173,0.14)" stroke="#00e3ad" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="330" y="700" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad">безпечний сектор</text>
  <path d="M 160 350 Q 260 640 520 760" fill="none" stroke="#00e3ad" stroke-width="6" stroke-dasharray="18 14" marker-end="url(#arrowGreen)"/>
  <text x="120" y="500" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad">вилаз уздовж стіни</text>

  <!-- Приціл біля кута -->
  <g stroke="#00e3ad" stroke-width="4">
    <circle cx="640" cy="800" r="18" fill="none"/>
    <line x1="640" y1="770" x2="640" y2="830"/>
    <line x1="610" y1="800" x2="670" y2="800"/>
  </g>
  <text x="640" y="870" font-family="Arial, sans-serif" font-size="24" fill="#00e3ad" text-anchor="middle">прицел одразу на кут</text>

  <!-- Легенда -->
  <g font-family="Arial, sans-serif" font-size="24">
    <circle cx="1330" cy="120" r="12" fill="#ff4162"/>
    <text x="1352" y="128" fill="#ff4162">загроза</text>
    <circle cx="1330" cy="164" r="12" fill="#00e3ad"/>
    <text x="1352" y="172" fill="#00e3ad">рекомендація</text>
  </g>

  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#ff4162" stroke-width="2.5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#00e3ad" stroke-width="2.5"/>
    </marker>
  </defs>
</svg>
