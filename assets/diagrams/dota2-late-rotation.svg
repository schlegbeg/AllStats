<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Схема: запізніла ротація у Dota 2">
  <title>Dota 2: запізніла ротація</title>
  <!-- Фон -->
  <rect width="1600" height="900" fill="#10151d"/>
  <text x="48" y="72" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#f1f4f7">Запізніла ротація</text>
  <text x="48" y="116" font-family="Arial, sans-serif" font-size="26" fill="#929ba8">Навчальна схема, а не запис реального матчу</text>

  <!-- Верхня лінія -->
  <path d="M 80 160 Q 800 90 1520 160" fill="none" stroke="#394351" stroke-width="26" stroke-linecap="round"/>
  <text x="90" y="130" font-family="Arial, sans-serif" font-size="26" fill="#929ba8">верхня лінія</text>

  <!-- Напарник під тиском на верхній лінії -->
  <circle cx="1240" cy="140" r="26" fill="#00e3ad"/>
  <circle cx="1240" cy="140" r="52" fill="none" stroke="#ff4162" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="1240" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#080b10" text-anchor="middle">Н</text>
  <text x="1240" y="60" font-family="Arial, sans-serif" font-size="26" fill="#ff4162" text-anchor="middle">напарник під тиском</text>
  <text x="1240" y="230" font-family="Arial, sans-serif" font-size="24" fill="#ff4162" text-anchor="middle">вишка втрачає HP</text>

  <!-- Ви на центрі -->
  <circle cx="620" cy="470" r="26" fill="#00e3ad"/>
  <text x="620" y="480" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#080b10" text-anchor="middle">В</text>
  <text x="620" y="540" font-family="Arial, sans-serif" font-size="26" fill="#f1f4f7" text-anchor="middle">ви на центрі</text>
  <text x="560" y="420" font-family="Arial, sans-serif" font-size="24" fill="#929ba8">центр лінії</text>

  <!-- Пізній пішохідний шлях -->
  <path d="M 660 450 Q 1000 480 1150 330 Q 1230 250 1235 195" fill="none" stroke="#ff4162" stroke-width="7" stroke-dasharray="20 14" marker-end="url(#arrowRed)"/>
  <text x="880" y="430" font-family="Arial, sans-serif" font-size="26" fill="#ff4162">пішки — 40+ секунд</text>

  <!-- Годинник запізнення -->
  <g transform="translate(950,620)">
    <circle r="52" fill="none" stroke="#ff4162" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#ff4162" stroke-width="5"/>
    <line x1="0" y1="0" x2="24" y2="12" stroke="#ff4162" stroke-width="5"/>
  </g>
  <text x="950" y="724" font-family="Arial, sans-serif" font-size="24" fill="#ff4162" text-anchor="middle">допомога прибуває надто пізно</text>

  <!-- Рекомендація: телепорт -->
  <path d="M 640 452 L 1200 172" fill="none" stroke="#00e3ad" stroke-width="7" stroke-dasharray="20 14" marker-end="url(#arrowGreen)"/>
  <g transform="translate(930,300)">
    <rect x="-34" y="-22" width="68" height="44" rx="8" fill="#00e3ad"/>
    <text y="9" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#080b10" text-anchor="middle">ТП</text>
  </g>
  <text x="300" y="300" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad">Рішення: телепорт-скролл</text>
  <text x="300" y="336" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad">реагуйте протягом 5 секунд</text>

  <!-- Легенда -->
  <g font-family="Arial, sans-serif" font-size="24">
    <circle cx="1330" cy="120" r="12" fill="#ff4162"/>
    <text x="1352" y="128" fill="#ff4162">загроза</text>
    <circle cx="1330" cy="164" r="12" fill="#00e3ad"/>
    <text x="1352" y="172" fill="#00e3ad">рекомендація</text>
  </g>

  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#ff4162" stroke-width="2.5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#00e3ad" stroke-width="2.5"/>
    </marker>
  </defs>
</svg>
