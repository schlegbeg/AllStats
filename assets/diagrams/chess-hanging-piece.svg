<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Схема: незахищена фігура у шахах">
  <title>Шахи: незахищена фігура</title>
  <!-- Фон -->
  <rect width="1600" height="900" fill="#10151d"/>
  <text x="48" y="72" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#f1f4f7">Незахищена фігура</text>
  <text x="48" y="116" font-family="Arial, sans-serif" font-size="26" fill="#929ba8">Навчальна схема, а не запис реальної партії</text>

  <!-- Дошка 8x8 -->
  <g>
    <rect x="96" y="190" width="512" height="512" fill="#1b2330" stroke="#394351" stroke-width="3"/>
    <!-- Світлі поля -->
    <g fill="#2b3547">
      <rect x="96" y="190" width="64" height="64"/><rect x="224" y="190" width="64" height="64"/><rect x="352" y="190" width="64" height="64"/><rect x="480" y="190" width="64" height="64"/>
      <rect x="160" y="254" width="64" height="64"/><rect x="288" y="254" width="64" height="64"/><rect x="416" y="254" width="64" height="64"/><rect x="544" y="254" width="64" height="64"/>
      <rect x="96" y="318" width="64" height="64"/><rect x="224" y="318" width="64" height="64"/><rect x="352" y="318" width="64" height="64"/><rect x="480" y="318" width="64" height="64"/>
      <rect x="160" y="382" width="64" height="64"/><rect x="288" y="382" width="64" height="64"/><rect x="416" y="382" width="64" height="64"/><rect x="544" y="382" width="64" height="64"/>
      <rect x="96" y="446" width="64" height="64"/><rect x="224" y="446" width="64" height="64"/><rect x="352" y="446" width="64" height="64"/><rect x="480" y="446" width="64" height="64"/>
      <rect x="160" y="510" width="64" height="64"/><rect x="288" y="510" width="64" height="64"/><rect x="416" y="510" width="64" height="64"/><rect x="544" y="510" width="64" height="64"/>
      <rect x="96" y="574" width="64" height="64"/><rect x="224" y="574" width="64" height="64"/><rect x="352" y="574" width="64" height="64"/><rect x="480" y="574" width="64" height="64"/>
      <rect x="160" y="638" width="64" height="64"/><rect x="288" y="638" width="64" height="64"/><rect x="416" y="638" width="64" height="64"/><rect x="544" y="638" width="64" height="64"/>
    </g>
    <!-- Координати -->
    <g font-family="Arial, sans-serif" font-size="20" fill="#929ba8" text-anchor="middle">
      <text x="112" y="724">a</text><text x="176" y="724">b</text><text x="240" y="724">c</text><text x="304" y="724">d</text><text x="368" y="724">e</text><text x="432" y="724">f</text><text x="496" y="724">g</text><text x="560" y="724">h</text>
      <text x="86" y="234">8</text><text x="86" y="298">7</text><text x="86" y="362">6</text><text x="86" y="426">5</text><text x="86" y="490">4</text><text x="86" y="554">3</text><text x="86" y="618">2</text><text x="86" y="682">1</text>
    </g>
    <!-- Фігури (текстові символи) -->
    <g font-family="Arial, sans-serif" font-size="52" text-anchor="middle">
      <!-- Чорні -->
      <text x="128" y="234" fill="#8a93a2">♜</text>
      <text x="512" y="234" fill="#8a93a2">♚</text>
      <text x="384" y="298" fill="#8a93a2">♞</text>
      <!-- Білі -->
      <text x="304" y="426" fill="#f1f4f7">♕</text>
      <text x="368" y="490" fill="#f1f4f7">♟</text>
      <text x="496" y="682" fill="#f1f4f7">♔</text>
    </g>
  </g>

  <!-- Ферка на d5 (центр поля: x=304, y=426) -->
  <circle cx="304" cy="410" r="46" fill="none" stroke="#ff4162" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="560" y="430" font-family="Arial, sans-serif" font-size="26" fill="#ff4162" text-anchor="middle">ферзь під боєм —</text>
  <text x="560" y="466" font-family="Arial, sans-serif" font-size="26" fill="#ff4162" text-anchor="middle">захищено нічим</text>

  <!-- Вісь ладії d8–d5 (загроза) -->
  <path d="M 128 262 L 296 392" fill="none" stroke="#ff4162" stroke-width="6" stroke-dasharray="16 12" marker-end="url(#arrowRed)"/>
  <text x="700" y="262" font-family="Arial, sans-serif" font-size="26" fill="#ff4162">ладія на d8 б'є ферзя</text>
  <text x="700" y="298" font-family="Arial, sans-serif" font-size="26" fill="#ff4162">по відкритій вертикалі «d»</text>
  <path d="M 690 275 Q 420 330 350 390" fill="none" stroke="#ff4162" stroke-width="4" stroke-dasharray="8 10"/>

  <!-- Рішення: відступ ферзя -->
  <path d="M 340 430 L 560 640" fill="none" stroke="#00e3ad" stroke-width="7" stroke-dasharray="18 14" marker-end="url(#arrowGreen)"/>
  <text x="700" y="560" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad">Рішення: відступ на безпечне поле</text>
  <text x="700" y="596" font-family="Arial, sans-serif" font-size="26" fill="#00e3ad">або одразу підтримуйте фігуру іншою</text>

  <!-- Легенда -->
  <g font-family="Arial, sans-serif" font-size="24">
    <circle cx="1330" cy="120" r="12" fill="#ff4162"/>
    <text x="1352" y="128" fill="#ff4162">загроза</text>
    <circle cx="1330" cy="164" r="12" fill="#00e3ad"/>
    <text x="1352" y="172" fill="#00e3ad">рекомендація</text>
  </g>

  <defs>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#ff4162" stroke-width="2.5"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#00e3ad" stroke-width="2.5"/>
    </marker>
  </defs>
</svg>
